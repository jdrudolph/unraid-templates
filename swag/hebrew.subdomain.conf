## hebrew-poc behind SWAG: https://hebrew.<your domain>
## Copy to /mnt/user/appdata/swag/nginx/proxy-confs/ and restart SWAG.
## Needs the hebrew-poc container on the same docker network as SWAG (proxynet).
## No SWAG auth in front: the app has its own Google sign-in.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name hebrew.*;

    include /config/nginx/ssl.conf;

    # voice recordings for the speaking check
    client_max_body_size 20m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app hebrew-poc;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
